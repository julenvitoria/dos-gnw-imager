<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" role="img" aria-label="DOS G&amp;W Imager — DosAT">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e4a6"/>
      <stop offset=".55" stop-color="#e7cd78"/>
      <stop offset="1" stop-color="#c9a74e"/>
