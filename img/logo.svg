<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" role="img" aria-label="DOS G&amp;W Imager">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6e4a6"/>
      <stop offset=".55" stop-color="#e7cd78"/>
      <stop offset="1" stop-color="#c9a74e"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#05080f"/>
    </linearGradient>
    <radialGradient id="btn" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#ff6a63"/>
      <stop offset="1" stop-color="#b4201d"/>
    </radialGradient>
    <style>
      .cur { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cur { animation: none; } }
    </style>
  </defs>
  <!-- body -->
  <rect x="1" y="1" width="62" height="46" rx="7" fill="url(#body)" stroke="#a8873a" stroke-width="1"/>
  <rect x="2.5" y="2.2" width="59" height="3" rx="1.5" fill="#fff" opacity=".35"/>
  <!-- screen: green bezel, dark glass, DOS prompt -->
  <rect x="15" y="6" width="34" height="26" rx="3.5" fill="#2d9a4a"/>
  <rect x="17.5" y="8.5" width="29" height="21" rx="1.6" fill="url(#screen)"/>
  <text x="19.5" y="21.5" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="7.2" font-weight="700" fill="#7dfc94">C:\&gt;</text>
  <rect class="cur" x="37.2" y="16.6" width="4" height="5.6" fill="#7dfc94"/>
  <rect x="17.5" y="8.5" width="29" height="7" rx="1.6" fill="#fff" opacity=".06"/>
  <!-- d-pad -->
  <rect x="7.4" y="30.4" width="4.2" height="12.2" rx=".9" fill="#16181d"/>
  <rect x="3.4" y="34.4" width="12.2" height="4.2" rx=".9" fill="#16181d"/>
  <circle cx="9.5" cy="36.5" r="1" fill="#2c3038"/>
  <!-- GAME / TIME -->
  <rect x="52" y="8" width="8" height="3.4" rx="1.7" fill="#8e949d"/>
  <rect x="52" y="13.6" width="8" height="3.4" rx="1.7" fill="#8e949d"/>
  <!-- B, A -->
  <circle cx="50.5" cy="39" r="3.6" fill="url(#btn)" stroke="#2d9a4a" stroke-width="1"/>
  <circle cx="58" cy="35" r="3.6" fill="url(#btn)" stroke="#2d9a4a" stroke-width="1"/>
</svg>
