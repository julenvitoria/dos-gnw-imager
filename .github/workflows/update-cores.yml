# Keep a copy of each core's latest release in cores/, so the page can put
# it in the .zip it makes: a browser cannot download a GitHub release asset
# from another site (no CORS on the download), but it can fetch a file from
# the page's own site.
#
# Runs every day, by hand (Actions -> Update cores -> Run workflow), and when
# this file changes. Commits only when a core changed.
name: Update cores

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update-cores.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p cores
          echo "{" > cores/cores.json.new
          sep=""
          for spec in dosat:DosAT-retro-go-sd dosxt:DosXT-retro-go-sd; do
            core=${spec%%:*}; repo=julenvitoria/${spec#*:}
            rel=$(gh api "repos/$repo/releases/latest")
            tag=$(jq -r .tag_name <<<"$rel")
            date=$(jq -r '.published_at[:10]' <<<"$rel")
            id=$(jq -r --arg n "$core.bin" '.assets[] | select(.name == $n) | .id' <<<"$rel")
            gh api -H "Accept: application/octet-stream" "repos/$repo/releases/assets/$id" > "cores/$core.bin"
            size=$(stat -c %s "cores/$core.bin")
            sha=$(sha256sum "cores/$core.bin" | cut -d' ' -f1)
            printf '%s  "%s": {"version": "%s", "date": "%s", "size": %s, "sha256": "%s", "repo": "%s"}' \
              "$sep" "$core" "$tag" "$date" "$size" "$sha" "$repo" >> cores/cores.json.new
            sep=$',\n'
            echo "$core: $tag ($size bytes)"
          done
          printf '\n}\n' >> cores/cores.json.new
          mv cores/cores.json.new cores/cores.json
          cat cores/cores.json

      - name: Commit if a core changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add cores
          if git diff --cached --quiet; then echo "cores are up to date"; exit 0; fi
          git commit -m "Cores: $(jq -r 'to_entries | map("\(.key) \(.value.version)") | join(", ")' cores/cores.json)"
          git push
